name: Prepare Manifest V2 Hashes

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backfill :v2 hashes in manifest.json
        run: |
          python3 - << 'EOF'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          BUILD_CRITICAL_ATTR_KEYS = {"runtime", "arch"}

          def get_port_build_hash(port_json_data: dict) -> str:
              if not isinstance(port_json_data, dict):
                  return ""
              filtered = {
                  "name": port_json_data.get("name"),
                  "items": sorted(port_json_data.get("items", []) or []),
                  "items_opt": sorted(port_json_data.get("items_opt", []) or []),
                  "attr": {
                      k: port_json_data.get("attr", {}).get(k)
                      for k in BUILD_CRITICAL_ATTR_KEYS
                      if k in port_json_data.get("attr", {})
                  },
              }
              serialized = json.dumps(filtered, sort_keys=True, separators=(",", ":"))
              return hashlib.sha256(serialized.encode("utf-8")).hexdigest()

          def get_file_md5(path: Path) -> str:
              h = hashlib.md5()
              with open(path, "rb") as f:
                  while chunk := f.read(65536):
                      h.update(chunk)
              return h.hexdigest()

          manifest_file = Path("releases/manifest.json")
          manifest = {}

          # 1. Try reading existing manifest file safely
          if manifest_file.is_file():
              content = manifest_file.read_text(encoding="utf-8").strip()
              if content:
                  try:
                      manifest = json.loads(content)
                      print(f"Loaded existing manifest.json with {len(manifest)} entries.")
                  except Exception as e:
                      print(f"Warning: Could not parse local manifest.json: {e}")
                      manifest = {}

          # 2. If manifest is empty, try downloading the latest release manifest
          if not manifest:
              release_org = "PortsMaster"
              release_repo = "PortMaster-New"

              if Path("SOURCE_SETUP.txt").is_file():
                  for line in Path("SOURCE_SETUP.txt").read_text().splitlines():
                      if "RELEASE_ORG" in line and '"' in line:
                          release_org = line.split('"')[1].strip()
                      if "RELEASE_REPO" in line and '"' in line:
                          release_repo = line.split('"')[1].strip()

              url = f"https://github.com/{release_org}/{release_repo}/releases/latest/download/manifest.json"
              print(f"Attempting to fetch latest release manifest from: {url}")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      manifest = json.loads(resp.read().decode("utf-8"))
                      print(f"Successfully fetched release manifest with {len(manifest)} entries.")
              except Exception as e:
                  print(f"Note: Could not fetch from releases ({e}). Building from local files.")
                  manifest = {}

          # 3. Iterate over all ports and backfill :v2 hashes
          ports_dir = Path("ports")
          count = 0

          for port_dir in sorted(ports_dir.iterdir()):
              if not port_dir.is_dir():
                  continue

              port_json_file = port_dir / "port.json"
              if not port_json_file.is_file():
                  continue

              rel_path = f"{port_dir.name}/port.json"
              try:
                  with open(port_json_file, "r", encoding="utf-8") as f:
                      port_data = json.load(f)

                  b_hash = get_port_build_hash(port_data)
                  
                  # Use existing raw hash if present in manifest; otherwise calculate MD5 from file
                  raw_hash = manifest.get(rel_path) or get_file_md5(port_json_file)

                  manifest[rel_path] = raw_hash
                  manifest[f"{rel_path}:v2"] = f"{b_hash}:{raw_hash}"
                  count += 1
              except Exception as e:
                  print(f"Error processing {rel_path}: {e}")

          # 4. Save updated manifest
          manifest_file.parent.mkdir(parents=True, exist_ok=True)
          with open(manifest_file, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)

          print(f"Successfully backfilled {count} port entries with :v2 build hashes.")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/manifest.json

          if git diff --staged --quiet; then
            echo "No changes to commit. Manifest already up to date."
          else
            git commit -m "ci: backfill :v2 build hashes in manifest.json"
            git push origin ${{ github.event.inputs.target_branch }}
          fi
